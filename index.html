<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaskFlow - Modern Task Management</title>

  <!-- SEO -->
  <meta name="description" content="TaskFlow is a modern task management app to streamline productivity with intuitive task tracking and organization." />
  <meta name="keywords" content="task management, productivity, to-do list, web app" />
  <meta name="author" content="Munyaradzi Chiondegwa" />

  <!-- Open Graph -->
  <meta property="og:title" content="TaskFlow - Modern Task Management" />
  <meta property="og:description" content="Streamline your productivity with intuitive task tools." />
  <meta property="og:image" content="https://yourdomain.com/images/taskflow-og-image.jpg" />
  <meta property="og:url" content="https://yourdomain.com" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles/styles.css" />
</head>

<body class="bg-gray-900 text-white font-archivo">

  <div class="container">

    <!-- LANDING PAGE -->
    <section id="landingPage" class="page active">
      <div class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full glass rounded-2xl p-8">
          <div class="text-center mb-8">
            <h1 class="text-3xl font-bold">TaskFlow</h1>
            <p class="text-gray-400 text-sm">Streamline your productivity</p>
          </div>

          <div class="space-y-4">
            <button onclick="showPage('loginPage')" class="btn-primary w-full">
              <i class="fas fa-sign-in-alt mr-2"></i> Sign In
            </button>

            <button onclick="showPage('registerPage')" class="btn-secondary w-full">
              <i class="fas fa-user-plus mr-2"></i> Create Account
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- LOGIN PAGE -->
    <section id="loginPage" class="page hidden">
      <div class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full glass rounded-2xl p-8">
          
          <div class="text-center mb-8">
            <h1 class="text-3xl font-bold">TaskFlow</h1>
            <h2 class="text-xl font-semibold text-gray-300">Welcome Back</h2>
          </div>

          <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
              <label class="text-sm">Username</label>
              <input type="text" id="loginUsername" class="input-field" required />
            </div>
            <div>
              <label class="text-sm">Password</label>
              <input type="password" id="loginPassword" class="input-field" required />
            </div>
            <div id="loginError" class="text-red-400 text-sm hidden"></div>

            <button class="btn-primary w-full">
              <i class="fas fa-sign-in-alt mr-2"></i> Sign In
            </button>
          </form>

          <div class="mt-6 text-center">
            <button onclick="showPage('registerPage')" class="text-sm text-gray-400 hover:text-accent">
              Don't have an account? <strong>Sign up</strong>
            </button>
          </div>

          <button onclick="showPage('landingPage')" class="mt-6 text-sm text-gray-500">
            <i class="fas fa-arrow-left mr-1"></i> Back
          </button>

        </div>
      </div>
    </section>

    <!-- REGISTER PAGE -->
    <section id="registerPage" class="page hidden">
      <div class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full glass rounded-2xl p-8">
          
          <div class="text-center mb-8">
            <h1 class="text-3xl font-bold">TaskFlow</h1>
            <h2 class="text-xl font-semibold text-gray-300">Create Account</h2>
          </div>

          <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-5">
            <div>
              <label class="text-sm">Username</label>
              <input type="text" id="registerUsername" class="input-field" required minlength="3" />
            </div>
            <div>
              <label class="text-sm">Email</label>
              <input type="email" id="registerEmail" class="input-field" required />
            </div>
            <div>
              <label class="text-sm">Password</label>
              <input type="password" id="registerPassword" class="input-field" required minlength="6" />
            </div>
            <div id="registerError" class="text-red-400 text-sm hidden"></div>

            <button class="btn-primary w-full">
              <i class="fas fa-user-plus mr-2"></i> Create Account
            </button>
          </form>

          <div class="mt-6 text-center">
            <button onclick="showPage('loginPage')" class="text-sm text-gray-400 hover:text-accent">
              Already have an account? <strong>Sign in</strong>
            </button>
          </div>

          <button onclick="showPage('landingPage')" class="mt-6 text-sm text-gray-500">
            <i class="fas fa-arrow-left mr-1"></i> Back
          </button>

        </div>
      </div>
    </section>

    <!-- DASHBOARD PAGE -->
    <section id="dashboardPage" class="page hidden">
      <header class="glass-light sticky top-0">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">

          <h1 class="text-2xl font-bold">TaskFlow</h1>

          <div class="flex items-center gap-3">
            <span class="text-sm text-gray-400 hidden sm:inline">
              Welcome, <span id="userDisplay" class="text-accent font-semibold"></span>
            </span>
            <div id="weatherWidget" class="text-sm text-gray-400 hidden sm:inline"></div>
            <button onclick="handleLogout()" class="btn-secondary px-4 py-2">
              <i class="fas fa-sign-out-alt mr-1"></i> Logout
            </button>
          </div>

        </div>
      </header>

      <main class="max-w-7xl mx-auto px-4 py-8">

        <!-- Stats -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
          <div class="stats-card">
            <p class="text-gray-400 text-sm">Total Tasks</p>
            <p class="text-3xl font-bold" id="totalTasks">0</p>
          </div>

          <div class="stats-card">
            <p class="text-gray-400 text-sm">Completed</p>
            <p class="text-3xl font-bold" id="completedTasks">0</p>
          </div>

          <div class="stats-card">
            <p class="text-gray-400 text-sm">Pending</p>
            <p class="text-3xl font-bold" id="pendingTasks">0</p>
          </div>
        </div>

        <!-- Controls -->
        <div class="glass-light rounded-xl p-4 mb-6 flex flex-col sm:flex-row gap-3 justify-between">
          <button onclick="openTaskModal()" class="btn-primary">
            <i class="fas fa-plus mr-2"></i> New Task
          </button>

          <div class="flex gap-3">
            <select id="filterStatus" class="input-field text-sm" onchange="filterTasks()">
              <option value="all">All Tasks</option>
              <option value="pending">Pending</option>
              <option value="completed">Completed</option>
            </select>

            <select id="sortBy" class="input-field text-sm" onchange="filterTasks()">
              <option value="date">Sort by Date</option>
              <option value="priority">Sort by Priority</option>
              <option value="title">Sort by Title</option>
            </select>
          </div>
        </div>

        <!-- Tasks -->
        <div id="tasksContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-16 hidden">
          <i class="fas fa-inbox text-6xl text-gray-600 mb-4"></i>
          <h3 class="text-xl font-semibold text-gray-400">No tasks yet</h3>
          <p class="text-gray-500">Create your first task to get started</p>
        </div>

      </main>
    </section>

  </div>

  <!-- FOOTER -->
  <footer class="max-w-7xl mx-auto px-4 py-8 text-sm text-gray-400">

    <div class="text-center mb-4 font-semibold">@2025 Munyaradzi Chiondegwa</div>

    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">

      <div class="flex flex-col items-start gap-2">
        <div id="currentDateTime" class="text-xs"></div>
      </div>

      <!-- Social ONLY here -->
      <nav class="flex gap-3">
        <a href="#" class="hover:text-white"><i class="fab fa-twitter"></i></a>
        <a href="#" class="hover:text-white"><i class="fab fa-linkedin"></i></a>
        <a href="#" class="hover:text-white"><i class="fab fa-github"></i></a>
        <a href="#" class="hover:text-white"><i class="fab fa-facebook"></i></a>
      </nav>

    </div>
  </footer>

  <!-- Scripts -->
  <script src="scripts/date.js" defer></script>
  <script src="scripts/weather.js" defer></script>
  <script src="scripts/app.js" defer></script>

</body>
</html>
