<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TaskFlow App - Modern Task Management</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/assests/styles/styles.css" />
  <style>
    .page { display:none; }
    .page.active { display:block; }
    .modal { display:none; position:fixed; inset:0; align-items:center; justify-content:center; z-index:60; }
    .modal.active { display:flex; }
    .modal-content { background: #0b1220; border-radius: 12px; width: 100%; max-width: 720px; }
    .hidden{ display:none; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Landing Page -->
    <div id="landingPage" class="page active">
      <div class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full glass rounded-2xl p-8 sm:p-10">
          <div class="text-center mb-8">
            <div class="logo mb-2">TaskFlow App</div>
            <p class="text-gray-400 text-sm">Streamline your productivity</p>
          </div>

          <div class="space-y-4">
            <button onclick="showPage('loginPage')" class="btn-primary w-full">
              <i class="fas fa-sign-in-alt mr-2"></i> Sign In
            </button>
            <button onclick="showPage('registerPage')" class="btn-secondary w-full">
              <i class="fas fa-user-plus mr-2"></i> Create Account
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Login Page -->
    <div id="loginPage" class="page">
      <div class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full glass rounded-2xl p-8 sm:p-10">
          <div class="text-center mb-8">
            <div class="logo mb-2">TaskFlow App</div>
            <h2 class="text-xl font-semibold text-gray-300">Welcome to TaskFlow</h2>
          </div>

          <form id="loginForm" class="space-y-5">
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-2">Username</label>
              <input type="text" id="loginUsername" class="input-field" placeholder="Enter your username" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-2">Password</label>
              <input type="password" id="loginPassword" class="input-field" placeholder="Enter your password" required>
            </div>

            <div class="flex items-center justify-between">
              <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" id="rememberMe"> Remember me
              </label>
            </div>

            <div id="loginError" class="text-red-400 text-sm hidden"></div>
            <button type="submit" class="btn-primary w-full" id="loginBtn">
              <i class="fas fa-sign-in-alt mr-2"></i> Sign In
            </button>
          </form>

          <div class="mt-6 text-center">
            <button onclick="showPage('registerPage')" class="text-sm text-gray-400 hover:text-accent transition">
              Don't have an account? <span class="font-semibold">Sign up</span>
            </button>
          </div>

          <div class="mt-6">
            <button onclick="showPage('landingPage')" class="text-sm text-gray-500 hover:text-gray-400 transition">
              <i class="fas fa-arrow-left mr-1"></i> Back
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Register Page -->
    <div id="registerPage" class="page">
      <div class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full glass rounded-2xl p-8 sm:p-10">
          <div class="text-center mb-8">
            <div class="logo mb-2">TaskFlow App</div>
            <h2 class="text-xl font-semibold text-gray-300">Create your account</h2>
          </div>

          <form id="registerForm" class="space-y-5">
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-2">Username</label>
              <input type="text" id="registerUsername" class="input-field" placeholder="Choose a username" required minlength="3">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-2">Email</label>
              <input type="email" id="registerEmail" class="input-field" placeholder="your@email.com" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-2">Password</label>
              <input type="password" id="registerPassword" class="input-field" placeholder="Create a strong password" required minlength="6">
            </div>
            <div id="registerError" class="text-red-400 text-sm hidden"></div>
            <button type="submit" class="btn-primary w-full">
              <i class="fas fa-user-plus mr-2"></i> Create Account
            </button>
          </form>

          <div class="mt-6 text-center">
            <button onclick="showPage('loginPage')" class="text-sm text-gray-400 hover:text-accent transition">
              Already have an account? <span class="font-semibold">Sign in</span>
            </button>
          </div>

          <div class="mt-6">
            <button onclick="showPage('landingPage')" class="text-sm text-gray-500 hover:text-gray-400 transition">
              <i class="fas fa-arrow-left mr-1"></i> Back
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Dashboard Page -->
    <div id="dashboardPage" class="page">
      <header class="glass-light sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
          <div class="flex items-center gap-4">
            <div class="logo">TaskFlow</div>
          </div>

          <div class="flex items-center gap-3">
            <span class="text-sm text-gray-400 hidden sm:inline">Welcome, <span id="userDisplay" class="text-accent font-semibold"></span></span>
            <button id="logoutBtn" class="btn-secondary text-sm px-4 py-2">
              <i class="fas fa-sign-out-alt mr-1"></i> Logout
            </button>
          </div>
        </div>
      </header>

      <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
          <div class="stats-card">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-gray-400 text-sm mb-1">Total Tasks</p>
                <p class="text-3xl font-bold" id="totalTasks">0</p>
              </div>
              <div class="w-12 h-12 rounded-full bg-blue-500/20 flex items-center justify-center">
                <i class="fas fa-tasks text-blue-400 text-xl"></i>
              </div>
            </div>
          </div>
          <div class="stats-card">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-gray-400 text-sm mb-1">Completed</p>
                <p class="text-3xl font-bold" id="completedTasks">0</p>
              </div>
              <div class="w-12 h-12 rounded-full bg-green-500/20 flex items-center justify-center">
                <i class="fas fa-check-circle text-green-400 text-xl"></i>
              </div>
            </div>
          </div>
          <div class="stats-card">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-gray-400 text-sm mb-1">Pending</p>
                <p class="text-3xl font-bold" id="pendingTasks">0</p>
              </div>
              <div class="w-12 h-12 rounded-full bg-orange-500/20 flex items-center justify-center">
                <i class="fas fa-clock text-orange-400 text-xl"></i>
              </div>
            </div>
          </div>
        </div>

        <div class="glass-light rounded-xl p-4 mb-6">
          <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
            <div class="flex gap-3 items-center">
              <button id="newTaskBtn" class="btn-primary">
                <i class="fas fa-plus mr-2"></i> New Task
              </button>

              <button id="exportBtn" class="btn-secondary text-sm px-3 py-2">
                <i class="fas fa-download mr-2"></i> Export Tasks
              </button>

              <label class="btn-secondary text-sm px-3 py-2 cursor-pointer">
                <i class="fas fa-file-import mr-2"></i> Import
                <input id="importFile" type="file" accept="application/json" class="hidden">
              </label>
            </div>

            <div class="flex flex-col sm:flex-row gap-3">
              <select id="filterStatus" class="input-field text-sm" onchange="window.taskController?.filterTasks()">
                <option value="all">All Tasks</option>
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
              </select>
              <select id="sortBy" class="input-field text-sm" onchange="window.taskController?.filterTasks()">
                <option value="date">Sort by Date</option>
                <option value="priority">Sort by Priority</option>
                <option value="title">Sort by Title</option>
              </select>
            </div>
          </div>
        </div>

        <div id="tasksContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

        <div id="emptyState" class="text-center py-16 hidden">
          <i class="fas fa-inbox text-6xl text-gray-600 mb-4"></i>
          <h3 class="text-xl font-semibold text-gray-400 mb-2">No tasks yet</h3>
          <p class="text-gray-500 mb-6">Create your first task to get started</p>
          <button id="createTaskBtn" class="btn-primary">
            <i class="fas fa-plus mr-2"></i> Create Task
          </button>
        </div>
      </main>
    </div>
  </div>

  <!-- Task Modal -->
  <div id="taskModal" class="modal">
    <div class="modal-content">
      <div class="p-6 border-b border-gray-700">
        <div class="flex items-center justify-between">
          <h3 class="text-xl font-bold" id="modalTitle">New Task</h3>
          <button id="taskModalClose" class="text-gray-400 hover:text-white transition">
            <i class="fas fa-times text-xl"></i>
          </button>
        </div>
      </div>
      <form id="taskForm" class="p-6 space-y-5">
        <input type="hidden" id="taskId">
        <div>
          <label class="block text-sm font-medium text-gray-400 mb-2">Task Title</label>
          <input type="text" id="taskTitle" class="input-field" placeholder="Enter task title" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-400 mb-2">Description</label>
          <textarea id="taskDescription" class="input-field" rows="4" placeholder="Add task details..."></textarea>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-400 mb-2">Due Date</label>
            <input type="date" id="taskDueDate" class="input-field" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-400 mb-2">Priority</label>
            <select id="taskPriority" class="input-field" required>
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>
        <div class="flex gap-3 pt-4">
          <button type="submit" class="btn-primary flex-1">
            <i class="fas fa-save mr-2"></i> Save Task
          </button>
          <button id="taskCancelBtn" type="button" class="btn-secondary flex-1">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Modal -->
  <div id="deleteModal" class="modal">
    <div class="modal-content max-w-md">
      <div class="p-6">
        <div class="text-center mb-6">
          <div class="w-16 h-16 rounded-full bg-red-500/20 flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-exclamation-triangle text-red-400 text-2xl"></i>
          </div>
          <h3 class="text-xl font-bold mb-2">Delete Task?</h3>
          <p class="text-gray-400">This action cannot be undone.</p>
        </div>
        <div class="flex gap-3">
          <button id="confirmDeleteBtn" class="btn-primary flex-1 bg-red-500 hover:bg-red-600">
            <i class="fas fa-trash mr-2"></i> Delete
          </button>
          <button id="cancelDeleteBtn" class="btn-secondary flex-1">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

  <footer id="appFooter"></footer>


  <!-- Module bootstrap -->
  <script type="module" src="src/app.js"></script>
</body>
</html>
